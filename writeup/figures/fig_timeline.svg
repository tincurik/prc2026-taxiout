  </g>
  <g id="text_14">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(14.4 397.9963)">Schematic, not a real flight. A flight the plan re-filed more than an hour after schedule never copies; a copy happens when the handler leaves the scheduled time in the</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(14.4 409.9713)">record.</text>
