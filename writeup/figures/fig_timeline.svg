  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(14.4 41.537969)">The label is take-off minus the recorded off-block. Illustrative times in minutes after the scheduled off-block; shaded: the</text>
