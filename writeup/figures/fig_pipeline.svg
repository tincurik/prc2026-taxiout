   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="99.4752" y="320.765544" transform="rotate(-0 99.4752 320.765544)">final prediction</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="99.4752" y="112.975207" transform="rotate(-0 99.4752 112.975207)">Inputs</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(41.500825 133.959032)">challenge files, METAR, OSM,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(29.692075 144.288407)">ADS-B, EUROCONTROL aggregates</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="289.5552" y="112.975207" transform="rotate(-0 289.5552 112.975207)">Features</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(243.21145 129.125907)">label-free: clocks, load,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(228.199575 139.159032)">weather, stand history, ADS-B,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(258.653325 149.559032)">record ordering</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="479.6352" y="98.950441" transform="rotate(-0 479.6352 98.950441)">Copy classifier</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="479.6352" y="118.794755" transform="rotate(-0 479.6352 118.794755)">P(off-block is the schedule)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="479.6352" y="162.221435" transform="rotate(-0 479.6352 162.221435)">11 regressors</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(419.25145 176.561765)">physical taxi time, blended by</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(468.882075 187.66614)">NNLS</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="669.7152" y="112.975598" transform="rotate(-0 669.7152 112.975598)">Mixture</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(609.230825 133.954657)">p · (MVT − SCHED) + (1 − p) ·</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(662.217075 145.134032)">taxi</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="669.7152" y="236.565702" transform="rotate(-0 669.7152 236.565702)">Rules chain</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(613.8752 256.778134)">delayed-row gate, plan cliff,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(618.65145 267.178134)">LIRF regimes, clock rules,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(636.227075 277.578134)">plan-window clip</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="479.6352" y="236.565702" transform="rotate(-0 479.6352 236.565702)">Stackers</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(416.700825 256.778134)">month-complete: ADS-B tracks,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(411.502075 267.178134)">member disagreement, departure</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(465.618325 278.122509)">stream</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="289.5552" y="236.565702" transform="rotate(-0 289.5552 236.565702)">Record tail</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(238.4827 256.778134)">LIRF copy classifier, near-</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(238.280825 267.178134)">schedule rule, daily delay</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(228.65395 277.578134)">calibration, duplicated records</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="99.4752" y="236.565702" transform="rotate(-0 99.4752 236.565702)">Bundle and post-steps</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(36.079575 256.778134)">stream-transformer inputs, four</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(47.828325 267.178134)">post-steps, then the plan-</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(76.067075 277.578134)">window clip</text>
   </g>
