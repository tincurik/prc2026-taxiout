  <g id="text_23">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="15.84" y="21.477656" transform="rotate(-0 15.84 21.477656)">The model in one picture</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="15.84" y="39.999375" transform="rotate(-0 15.84 39.999375)">Left to right along the top, then right to left along the bottom. Every box is described in docs/model.md.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(15.84 383.7691)">Colour = what kind of component: label structure (what the recorded time means), models and features, open data. The record tail mixes record rules with the calibration</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(15.84 394.9691)">to EUROCONTROL's published daily delay (open data).</text>
  </g>
